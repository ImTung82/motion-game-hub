<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Enspire Digital: motion-controlled English learning games for kids. Play with your face and hands!">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Enspire Arcade">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Enspire Arcade</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Màn hình tần số cao (120/144Hz): Flutter chỉ vẽ cách khung >= 10ms (144Hz -> 72 FPS, 120Hz -> 60 FPS;
    60/90Hz giữ nguyên). Vẽ 144 FPS chiếm GPU của MediaPipe: đo trên laptop Intel UHD, nhận diện tay
    93ms -> 58ms/lần (11 -> 17 lần/giây), game vẫn đều 72 FPS. Tắt để đo: thêm ?fps=max vào URL.
    Mọi callback trong cùng 1 vsync có chung timestamp => cho qua / hoãn cả nhóm, không làm lệch nhau.
  -->
  <script>
    (() => {
      if (new URLSearchParams(location.search).get('fps') === 'max') return;
      const MIN_FRAME_GAP_MS = 10;
      const raf = window.requestAnimationFrame.bind(window);
      const caf = window.cancelAnimationFrame.bind(window);
      const pending = new Map(); // id trả cho người gọi -> id rAF thật hiện tại (đổi mỗi lần hoãn)
      let nextId = 1;
      let lastFrame = -Infinity;
      window.requestAnimationFrame = (callback) => {
        const id = nextId++;
        const onVsync = (t) => {
          if (t !== lastFrame && t - lastFrame < MIN_FRAME_GAP_MS) {
            pending.set(id, raf(onVsync));
            return;
          }
          pending.delete(id);
          lastFrame = t;
          callback(t);
        };
        pending.set(id, raf(onVsync));
        return id;
      };
      window.cancelAnimationFrame = (id) => {
        const real = pending.get(id);
        if (real === undefined) return;
        pending.delete(id);
        caf(real);
      };
    })();
  </script>

  <!-- Camera + MediaPipe cho bản web (window.motionBridge) -->
  <script type="module" src="motion/motion_bridge.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
